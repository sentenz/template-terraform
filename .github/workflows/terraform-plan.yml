# SPDX-License-Identifier: Apache-2.0

name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      root:
        description: "Deployable Terraform root (for example environments/stage/ec2)"
        required: true
        type: string
        default: environments/stage/ec2

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  prepare:
    name: Validate plan target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      root: ${{ steps.target.outputs.root }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate target
        id: target
        shell: bash
        env:
          INPUT_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          root="${INPUT_ROOT%/}"
          case "${root}" in
            environments/stage/*|environments/prod/*) ;;
            *)
              echo "::error::Only stage/prod roots below environments/ may be planned."
              exit 1
              ;;
          esac
          for indicator in main.tf versions.tf backend.tf; do
            if [[ ! -f "${root}/${indicator}" ]]; then
              echo "::error::${root} is not a deployable Terraform root: missing ${indicator}."
              exit 1
            fi
          done
          environment="$(cut -d/ -f2 <<< "${root}")"
          echo "root=${root}" >> "${GITHUB_OUTPUT}"
          echo "environment=${environment}" >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan ${{ needs.prepare.outputs.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare]
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-plan-${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.root }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.16.4
      - name: Initialize remote backend
        env:
          TF_ROOT: ${{ needs.prepare.outputs.root }}
        run: terraform -chdir="${TF_ROOT}" init -reconfigure -input=false
      - name: Create runner-local plan
        env:
          TF_ROOT: ${{ needs.prepare.outputs.root }}
          TF_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        shell: bash
        run: |
          set -euo pipefail
          plan_file="${RUNNER_TEMP}/terraform.tfplan"
          plan_log="${RUNNER_TEMP}/terraform-plan.log"

          if ! terraform -chdir="${TF_ROOT}" plan -lock-timeout=5m -out="${plan_file}" >"${plan_log}" 2>&1; then
            echo "::error::Terraform plan failed. Full plan output is intentionally not published from this public template."
            exit 1
          fi

          summary="$(terraform -chdir="${TF_ROOT}" show -json "${plan_file}" | jq -c '
            [.resource_changes[]?.change.actions] as $actions
            | {
                create: ($actions | map(select(index("create"))) | length),
                update: ($actions | map(select(index("update"))) | length),
                delete: ($actions | map(select(index("delete"))) | length),
                no_op:  ($actions | map(select(. == ["no-op"])) | length)
              }
          ')"

          {
            echo "### Terraform plan summary"
            echo ""
            echo "- Root: `${TF_ROOT}`"
            echo "- Environment: `${TF_ENVIRONMENT}`"
            echo "- Change counts: `${summary}`"
            echo ""
            echo "The binary plan and full plan output remain runner-local and are not uploaded as artifacts."
          } >> "${GITHUB_STEP_SUMMARY}"
